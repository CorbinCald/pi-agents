name: Package Report
description: Report a problematic Pi package listed on pi.dev
labels: ["package-report"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to report a third-party package as it behaves with Pi Agents. Reports about the upstream pi.dev gallery itself should be filed with the upstream service.

        Read [CONTRIBUTING.md](https://github.com/CorbinCald/pi-agents/blob/main/CONTRIBUTING.md) and keep the report concise.

  - type: input
    id: package-name
    attributes:
      label: Package name
      description: The npm package name from pi.dev.
      placeholder: "@scope/package"
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: Version
      description: The package version shown on pi.dev.
      placeholder: "0.1.0"
    validations:
      required: false

  - type: dropdown
    id: report-type
    attributes:
      label: What are you reporting?
      options:
        - Malicious or unsafe behavior
        - Impersonation
        - Trademark / TOS Violations
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Describe the concern and include links, logs, or screenshots if helpful.
    validations:
      required: true
